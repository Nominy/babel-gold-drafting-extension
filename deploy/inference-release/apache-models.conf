# Include inside the existing reviewgen.ovh TLS vhost after staging these files.
Alias "/browser-model/c-denoise-v3-2026-10-03/" "/opt/babel/models/c-denoise-v3-2026-10-03/"
<Directory "/opt/babel/models/c-denoise-v3-2026-10-03">
    Require all granted
    Options -Indexes
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
    Header always set Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges"
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Directory>
