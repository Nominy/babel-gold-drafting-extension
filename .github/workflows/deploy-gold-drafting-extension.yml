name: Deploy Gold Drafting Extension

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: Chrome Web Store publish mode
        type: choice
        options:
          - DEFAULT_PUBLISH
          - STAGED_PUBLISH
        default: DEFAULT_PUBLISH
      skip_review:
        description: Request skipReview=true when the item is eligible
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-drafting-extension-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bump release version
        run: npm run version:patch

      - name: Validate extension
        run: |
          npm run typecheck
          npm test

      - name: Build release ZIP
        env:
          BABEL_EXTENSION_ZIP_DIR: ${{ github.workspace }}/.artifacts
        run: npm run build:zip

      - name: Capture release metadata
        id: metadata
        run: |
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.version);")
          ZIP_PATH="${GITHUB_WORKSPACE}/.artifacts/babel-gold-drafting-extension-${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: babel-gold-drafting-extension-${{ steps.metadata.outputs.version }}
          path: ${{ steps.metadata.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ACCESS_TOKEN: ${{ secrets.CWS_ACCESS_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type }}
          CWS_SKIP_REVIEW: ${{ inputs.skip_review }}
          CWS_ZIP_PATH: ${{ steps.metadata.outputs.zip_path }}
        run: node scripts/publish-cws.mjs

      - name: Commit version bump
        run: |
          if git diff --quiet -- package.json package-lock.json manifest.json; then
            echo "Version files already match the deployed state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json
          git commit -m "chore: release gold drafting extension ${{ steps.metadata.outputs.version }}"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Resolve release target
        id: release_target
        run: |
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.metadata.outputs.version }}
          ZIP_PATH: ${{ steps.metadata.outputs.zip_path }}
          TARGET_SHA: ${{ steps.release_target.outputs.target_sha }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
