name: Release Gold Drafting Extension

# Push to main only produces a GitHub pre-release (tag v<manifest version> + ZIP asset).
# Publishing to the Chrome Web Store requires a manual workflow_dispatch with an explicit
# version and a typed confirmation; the publish job cannot run from a push event.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish. Must equal manifest.json on the selected ref and have an existing pre-release v<version>.
        type: string
        required: true
      confirm:
        description: Type "PUBLISH <version>" (for example "PUBLISH 0.1.34") to confirm the Chrome Web Store publish.
        type: string
        required: true
      publish_type:
        description: Chrome Web Store publish mode
        type: choice
        options:
          - STAGED_PUBLISH
          - DEFAULT_PUBLISH
        default: STAGED_PUBLISH
      replace_pending_submission:
        description: Cancel the current pending review before uploading this release
        type: boolean
        default: false

concurrency:
  group: gold-drafting-extension-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerelease:
    name: Build and pre-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out shared extension platform
        run: |
          mkdir -p ../../shared
          git clone --depth 1 https://github.com/Nominy/babel-extension-platform.git ../../shared/babel-extension-platform

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shared platform dependencies
        working-directory: ../../shared/babel-extension-platform
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Validate extension
        run: |
          npm run typecheck
          npm test

      - name: Build release ZIP
        env:
          BABEL_EXTENSION_ZIP_DIR: ${{ github.workspace }}/.artifacts
        run: |
          npm run build:core
          npm run build:zip -- --no-build

      - name: Capture release metadata
        id: metadata
        run: |
          if ! git diff --quiet -- package.json package-lock.json manifest.json; then
            echo "::error::The build modified version files. The release version must be committed, not generated in CI."
            git --no-pager diff -- package.json package-lock.json manifest.json
            exit 1
          fi
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.version);")
          ZIP_PATH="${GITHUB_WORKSPACE}/.artifacts/babel-gold-drafting-extension-${VERSION}.zip"
          test -f "$ZIP_PATH"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: babel-gold-drafting-extension-${{ steps.metadata.outputs.version }}
          path: ${{ steps.metadata.outputs.zip_path }}
          if-no-files-found: error

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.metadata.outputs.version }}
          ZIP_PATH: ${{ steps.metadata.outputs.zip_path }}
        run: |
          if IS_PRERELEASE=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2> /dev/null); then
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::$TAG_NAME is already a published release. Bump the version in manifest.json, package.json and package-lock.json (npm run version:patch) before merging to main."
              exit 1
            fi
            echo "Replacing existing pre-release $TAG_NAME so its tag points at $GITHUB_SHA."
            gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG_NAME" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --prerelease \
            --generate-notes

  publish:
    name: Publish to Chrome Web Store
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify publish request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::version input '$REQUESTED_VERSION' is not a valid extension version."
            exit 1
          fi
          MANIFEST_VERSION=$(node --input-type=module -e "import fs from 'node:fs'; const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); process.stdout.write(manifest.version);")
          if [ "$REQUESTED_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::version input '$REQUESTED_VERSION' does not match manifest.json version '$MANIFEST_VERSION' on $GITHUB_REF."
            exit 1
          fi
          if [ "$CONFIRMATION" != "PUBLISH $REQUESTED_VERSION" ]; then
            echo "::error::confirm input must be exactly 'PUBLISH $REQUESTED_VERSION'."
            exit 1
          fi
          TAG_NAME="v$REQUESTED_VERSION"
          if ! TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/${TAG_NAME}^{commit}"); then
            echo "::error::Tag $TAG_NAME does not exist. Merge the version to main first so the pre-release is created."
            exit 1
          fi
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG_NAME points at $TAG_SHA but this run is building $GITHUB_SHA. Run the publish from the pre-released commit."
            exit 1
          fi
          if ! IS_PRERELEASE=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease'); then
            echo "::error::No GitHub release exists for $TAG_NAME."
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::$TAG_NAME is already a published release; it cannot be published again."
            exit 1
          fi
          echo "version=${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${GITHUB_WORKSPACE}/.artifacts/babel-gold-drafting-extension-${REQUESTED_VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Check out shared extension platform
        run: |
          mkdir -p ../../shared
          git clone --depth 1 https://github.com/Nominy/babel-extension-platform.git ../../shared/babel-extension-platform

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shared platform dependencies
        working-directory: ../../shared/babel-extension-platform
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Validate extension
        run: |
          npm run typecheck
          npm test

      - name: Build release ZIP
        env:
          BABEL_EXTENSION_ZIP_DIR: ${{ github.workspace }}/.artifacts
          ZIP_PATH: ${{ steps.request.outputs.zip_path }}
        run: |
          npm run build:core
          npm run build:zip -- --no-build
          if ! git diff --quiet -- package.json package-lock.json manifest.json; then
            echo "::error::The build modified version files; refusing to publish a version that differs from the commit."
            exit 1
          fi
          test -f "$ZIP_PATH"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: babel-gold-drafting-extension-${{ steps.request.outputs.version }}-published
          path: ${{ steps.request.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ACCESS_TOKEN: ${{ secrets.CWS_ACCESS_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type }}
          CWS_SKIP_REVIEW: 'false'
          CWS_CANCEL_PENDING: ${{ inputs.replace_pending_submission && 'true' || 'false' }}
          CWS_ZIP_PATH: ${{ steps.request.outputs.zip_path }}
        run: node scripts/publish-cws.mjs

      - name: Promote GitHub pre-release to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.request.outputs.tag_name }}
          ZIP_PATH: ${{ steps.request.outputs.zip_path }}
        run: |
          gh release upload "$TAG_NAME" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
